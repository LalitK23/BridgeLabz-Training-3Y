<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tooltip Demonstration</title>
  <link rel="stylesheet" href="tooltip.css">
</head>
<body>

  <h1>CSS Tooltip Demonstration</h1>

  <div class="container">

    <div class="tooltip">
      💡
      <span class="tooltiptext">This is a light bulb icon tooltip!</span>
    </div>

    <div class="tooltip">
      🔔
      <span class="tooltiptext">This shows a notification bell tooltip!</span>
    </div>

    <div class="tooltip">
      ❤️
      <span class="tooltiptext">This is a heart tooltip!</span>
    </div>

    <div class="tooltip">
      <span class="word">Hover Me</span>
      <span class="tooltiptext">Tooltip on text using CSS!</span>
    </div>

  </div>

</body>
</html>
