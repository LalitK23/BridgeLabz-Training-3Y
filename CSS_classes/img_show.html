<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Showcase Layout</title>
  <link rel="stylesheet" href="img.show.css">
</head>
<body>

  <h1>Beautiful Image Showcase</h1>

  <div class="gallery">

    <figure class="image-card">
      <img src="https://picsum.photos/400/250?random=1" alt="Nature 1">
      <figcaption>Peaceful Lake View</figcaption>
    </figure>

    <figure class="image-card">
      <img src="https://picsum.photos/400/250?random=2" alt="Nature 2">
      <figcaption>Sunset in the Hills</figcaption>
    </figure>

    <figure class="image-card">
      <img src="https://picsum.photos/400/250?random=3" alt="Nature 3">
      <figcaption>Forest Morning Light</figcaption>
    </figure>

    <figure class="image-card">
      <img src="https://picsum.photos/400/250?random=4" alt="Nature 4">
      <figcaption>Calm Ocean Waves</figcaption>
    </figure>

    <figure class="image-card">
      <img src="https://picsum.photos/400/250?random=5" alt="Nature 5">
      <figcaption>Rocky Mountain Path</figcaption>
    </figure>

    <figure class="image-card">
      <img src="https://picsum.photos/400/250?random=6" alt="Nature 6">
      <figcaption>Golden Desert Dunes</figcaption>
    </figure>

  </div>

</body>
</html>
