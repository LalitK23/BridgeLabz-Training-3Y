<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Animation Demonstration</title>
  <link rel="stylesheet" href="animation.css">
</head>
<body>

  <h1>🎬 CSS Animation Demonstration</h1>

  <div class="animation-container">

    <!-- 1️⃣ Moving Box -->
    <div class="box"></div>
    <p class="caption">Moving Box (uses <b>@keyframes moveBox</b>)</p>

    <!-- 2️⃣ Bouncing Ball -->
    <div class="ball"></div>
    <p class="caption">Bouncing Ball (uses <b>@keyframes bounce</b>)</p>

    <!-- 3️⃣ Color Changing Text -->
    <h2 class="color-text">Color Changing Text</h2>
    <p class="caption">Uses <b>@keyframes colorShift</b> with infinite alternate direction</p>

  </div>

</body>
</html>
