<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>

  <!-- ✅ Bootstrap CSS via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- ✅ Custom CSS -->
  <link rel="stylesheet" href="portfolio.css">
</head>
<body class="bg-light text-dark">

  <!-- ✅ Header Section -->
  <header class="text-center p-5 bg-white shadow-sm">
    <h1 class="fw-bold mb-3">Krish Patel</h1>
    <p class="lead text-muted">Web Developer | Designer | Tech Enthusiast</p>
  </header>

  <!-- ✅ Profile Section -->
  <section class="container text-center mt-4">
    <img src="https://via.placeholder.com/180" alt="Profile Image" class="img-fluid rounded-circle mb-3 shadow-sm">

    <h2 class="fw-bold">Hello, I'm Krish 👋</h2>
    <p class="text-muted mb-4">I create modern, responsive websites using the latest technologies.</p>

    <div class="d-flex justify-content-center gap-3 mb-5">
      <a href="#" class="btn btn-primary px-4">Hire Me</a>
      <a href="#" class="btn btn-outline-dark px-4">Download CV</a>
    </div>
  </section>

  <!-- ✅ Contact Form -->
  <section class="container text-center mb-5">
    <h3 class="fw-bold mb-3">Contact Me</h3>
    <form class="mx-auto" style="max-width: 500px;">
      <div class="mb-3">
        <input type="text" class="form-control" placeholder="Your Name">
      </div>
      <div class="mb-3">
        <input type="email" class="form-control" placeholder="Your Email">
      </div>
      <div class="mb-3">
        <textarea class="form-control" rows="4" placeholder="Your Message"></textarea>
      </div>
      <button type="submit" class="btn btn-success px-4">Send Message</button>
    </form>
  </section>

  <!-- ✅ Footer -->
  <footer class="text-center bg-white py-3 mt-5 shadow-sm">
    <p class="mb-0">© 2025 Krish Patel | All Rights Reserved</p>
  </footer>

  <!-- ✅ Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
