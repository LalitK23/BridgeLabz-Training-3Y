<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker</title>

  <!-- ✅ Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- ✅ Custom CSS -->
  <link rel="stylesheet" href="task_tracker.css">
</head>
<body class="bg-light">

  <!-- ✅ Header -->
  <header class="bg-primary text-white text-center py-3 mb-4">
    <h2 class="fw-bold mb-0">Task Tracker</h2>
    <p class="mb-0">Pending Tasks <span class="badge bg-warning text-dark">3</span></p>
  </header>

  <!-- ✅ Task List -->
  <section class="container">
    <ul class="list-group shadow-sm">
      
      <!-- 📝 Task 1 -->
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Complete Bootstrap Assignment
        <span class="badge bg-danger">High</span>
      </li>

      <!-- 📝 Task 2 -->
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Review Portfolio Design
        <span class="badge bg-warning text-dark">Medium</span>
      </li>

      <!-- 📝 Task 3 -->
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Watch Web Development Tutorial
        <span class="badge bg-success">Low</span>
      </li>
    </ul>

    <!-- ✅ Completed Button -->
    <div class="text-center mt-4">
      <button class="btn btn-success">
        Completed <span class="badge bg-light text-success">2</span>
      </button>
    </div>
  </section>

  <!-- ✅ Footer -->
  <footer class="text-center py-3 mt-5 bg-white shadow-sm">
    <p class="mb-0 text-muted">© 2025 Task Tracker | Built with Bootstrap</p>
  </footer>

  <!-- ✅ Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
