<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Transformations Showcase</title>
  <link rel="stylesheet" href="transformation.css">
</head>
<body>
  <h1>🎨 CSS Transformations Showcase</h1>

  <div class="container">
    <div class="transform-box rotate">
      <div class="shape"></div>
      <p>rotate()</p>
    </div>

    <div class="transform-box scale">
      <div class="shape"></div>
      <p>scale()</p>
    </div>

    <div class="transform-box translate">
      <div class="shape"></div>
      <p>translate()</p>
    </div>

    <div class="transform-box skew">
      <div class="shape"></div>
      <p>skew()</p>
    </div>
  </div>
</body>
</html>
