<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadows and Depth Effect Layout</title>
  <link rel="stylesheet" href="shadows.css">
</head>
<body>
  <h1>🌟 Shadows and Depth Effect Layout</h1>

  <div class="card-container">
    <div class="card card1">
      <img src="https://via.placeholder.com/100" alt="Profile 1">
      <h2>Card One</h2>
      <p>This card uses a soft shadow for a subtle 3D look.</p>
    </div>

    <div class="card card2">
      <img src="https://via.placeholder.com/100" alt="Profile 2">
      <h2>Card Two</h2>
      <p>This one has a deeper shadow for stronger visual depth.</p>
    </div>

    <div class="card card3">
      <img src="https://via.placeholder.com/100" alt="Profile 3">
      <h2>Card Three</h2>
      <p>This card uses a colored shadow for a creative touch.</p>
    </div>
  </div>
</body>
</html>
