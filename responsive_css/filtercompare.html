<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filter Comparison Layout</title>
  <link rel="stylesheet" href="filtercompare.css">
</head>
<body>

  <!-- ===== Header Section ===== -->
  <header>
    <h1>🖼️ Filter Comparison Layout</h1>
    <p>Compare the original and filtered versions of an image side-by-side.</p>
  </header>

  <!-- ===== Main Content Section ===== -->
  <main>
    <section class="comparison-container">

      <!-- Left (Original) Image -->
      <figure class="image-card">
        <img src="https://picsum.photos/id/1018/600/400" alt="Original Landscape">
        <figcaption>Original Image</figcaption>
      </figure>

      <!-- Right (Filtered) Image -->
      <figure class="image-card filtered">
        <img src="https://picsum.photos/id/1018/600/400" alt="Filtered Landscape">
        <figcaption>Filtered (Brightness Reduced)</figcaption>
      </figure>

    </section>
  </main>

  <!-- ===== Footer Section ===== -->
  <footer>
    <p>© 2025 Filter Comparison Layout | Created with ❤️ using HTML & CSS</p>
  </footer>

</body>
</html>
