<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image Filter Gallery</title>
  <link rel="stylesheet" href="img.filter.css">
</head>
<body>

  <!-- ===== Header Section ===== -->
  <header>
    <h1>🎨 Responsive Image Filter Gallery</h1>
    <p>Hover over each image to see the original version!</p>
  </header>

  <!-- ===== Main Gallery Section ===== -->
  <main>
    <section class="gallery">
      
      <!-- Image 1 -->
      <figure class="image-card blur">
        <img src="https://picsum.photos/id/1015/400/300" alt="Mountain View">
        <figcaption>Blur Filter</figcaption>
      </figure>

      <!-- Image 2 -->
      <figure class="image-card grayscale">
        <img src="https://picsum.photos/id/1025/400/300" alt="Dog Portrait">
        <figcaption>Grayscale Filter</figcaption>
      </figure>

      <!-- Image 3 -->
      <figure class="image-card sepia">
        <img src="https://picsum.photos/id/1003/400/300" alt="Nature View">
        <figcaption>Sepia Filter</figcaption>
      </figure>

      <!-- Image 4 -->
      <figure class="image-card brightness">
        <img src="https://picsum.photos/id/1043/400/300" alt="Bridge View">
        <figcaption>Brightness Filter</figcaption>
      </figure>

      <!-- Image 5 -->
      <figure class="image-card contrast">
        <img src="https://picsum.photos/id/1050/400/300" alt="City Skyline">
        <figcaption>Contrast Filter</figcaption>
      </figure>

      <!-- Image 6 -->
      <figure class="image-card hue">
        <img src="https://picsum.photos/id/1069/400/300" alt="Forest Path">
        <figcaption>Hue Rotate Filter</figcaption>
      </figure>

    </section>
  </main>

  <!-- ===== Footer Section ===== -->
  <footer>
    <p>Made with ❤️ for CSS Practice | © 2025</p>
  </footer>

</body>
</html>
